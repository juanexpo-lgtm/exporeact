<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPO REACT V4</title>

    <style>
/* =====================================================
   EXPO REACT V4
   Hoja de estilos
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:white;

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* ---------- PANEL ---------- */

#panel{

    width:500px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 25px rgba(0,0,0,.15);

}

h1{

    text-align:center;

    margin-bottom:30px;

    font-size:34px;

}

.grupo{

    margin-bottom:25px;

}

label{

    display:block;

    margin-bottom:10px;

    font-weight:bold;
 text-align:center;
}

/* ---------- CONTROLES ---------- */

.controlNumero{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

}

.controlNumero button{

    width:42px;

    height:42px;

    font-size:24px;

    cursor:pointer;

}

.controlNumero span{

    width:80px;

    text-align:center;

    font-size:26px;

}

/* ---------- PALETA ---------- */

#paleta{

    display:flex;

    justify-content:center;
gap:15px;

}

.color{

    width:55px;

    height:55px;

    border-radius:8%;

    border:2px solid transparent;

    cursor:pointer;

    transition:.2s;

}

.color.activo{

    border-color:black;

    opacity:1;


}

.color:not(.activo){

    opacity:.30;

}

/* ---------- PLAY ESTILO ---------- */

#play{

    width:100%;

    height:55px;

    font-size:30px;

    background:#000000;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

/* ---------- BOTÓN STOP ESTILO ---------- */

#stop{

    position:fixed;

    left:50%;

    bottom:30px;

    transform:translateX(-50%);

    width:100px;

    height:48px;

    background:rgba(0,0,0,.5);

    color:white;

    font-size:18px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    display:none;

    z-index:1000;

}

/* ===== BOTÓN PAUSA ESTILO ===== */

#pausa{
position:fixed;
left:calc(50% - 70px);
bottom:30px;
transform:translateX(-100%);
width:100px;
height:48px;
background:rgba(0,0,0,.5);
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
display:none;
z-index:1000;
}
/* ===== CRONOMETRO ESTILO ===== */
#cronometro{
position:fixed;top:20px;right:25px;
padding:6px 12px;
background:rgba(0,0,0,.5);
color:white;
font-size:22px;
font-family:Consolas,monospace;
border-radius:8px;
display:none;
z-index:2000;
user-select:none;
}


</style>
</head>

<body>

    <div id="panel">

        <div class="grupo">

            <label>INTERVALO ENTRE ESTÍMULOS (segundos)</label>

            <div class="controlNumero">

                <button id="menosIntervalo">−</button>

                <span id="valorIntervalo">1.0</span>

                <button id="masIntervalo">+</button>

            </div>

        </div>

        <div class="grupo">

            <label>PANTALLA BLANCA (ms)</label>

            <div class="controlNumero">

                <button id="menosBlanco">−</button>

                <span id="valorBlanco">500</span>

                <button id="masBlanco">+</button>

            </div>

        </div>

        <div class="grupo">

            <label>ELIGE NÚMERO DE ESTÍMULOS Y COLORES</label>

            <div id="paleta">

                <button class="color activo"
                        data-color="red"
                        style="background:red">
                </button>

                <button class="color activo"
                        data-color="blue"
                        style="background:blue">
                </button>

                <button class="color activo"
                        data-color="#60F013"
                        style="background:#60F013">
                </button>

                <button class="color activo"
                        data-color="yellow"
                        style="background:#fff52d">
                </button>

            </div>

        </div>

        <button id="play">START</button>

    </div>

   <div id="botonera">

    <button id="pausa">PAUSA</button>

    <button id="stop">SALIR</button>

</div>
<div id="cronometro">00:00</div>

    <script>
    /* ------------SCRIPT----------------------------- */

    const panel=document.getElementById("panel");
    const play=document.getElementById("play");
    const stop=document.getElementById("stop");
const pausa=document.getElementById("pausa");
const cronometro=document.getElementById("cronometro");

    const menosIntervalo=document.getElementById("menosIntervalo");
    const masIntervalo=document.getElementById("masIntervalo");
    const menosBlanco=document.getElementById("menosBlanco");
    const masBlanco=document.getElementById("masBlanco");

    const valorIntervalo=document.getElementById("valorIntervalo");
    const valorBlanco=document.getElementById("valorBlanco");

    const botones=[...document.querySelectorAll(".color")];

    let intervalo=1.0;
    let blanco=500;
    let ejecutando=false;
    let t1=null,t2=null;
let pausado=false;
let tiempoAcumulado=0;
let inicioCronometro;
let relojCronometro;

    function actualizar(){
      valorIntervalo.textContent=intervalo.toFixed(1);
      valorBlanco.textContent=blanco;
    }
    actualizar();

    masIntervalo.onclick=()=>{intervalo=+(intervalo+0.1).toFixed(1);actualizar();}
    menosIntervalo.onclick=()=>{intervalo=Math.max(0.1,+(intervalo-0.1).toFixed(1));actualizar();}
    masBlanco.onclick=()=>{blanco+=100;actualizar();}
    menosBlanco.onclick=()=>{blanco=Math.max(0,blanco-100);actualizar();}

    botones.forEach(b=>{
     b.onclick=()=>{
       if(b.classList.contains("activo")){
          if(document.querySelectorAll(".color.activo").length>2){
             b.classList.remove("activo");
          }
       }else{
          b.classList.add("activo");
       }
     };
    });

    function activos(){
     return [...document.querySelectorAll(".color.activo")].map(b=>b.dataset.color);
    }

    function azar(){
     const c=activos();
     return c[Math.floor(Math.random()*c.length)];
    }

    function ciclo(){
     if(!ejecutando) return;
     document.body.style.background="white";
     t1=setTimeout(()=>{
       if(!ejecutando) return;
       document.body.style.background=azar();
       t2=setTimeout(ciclo,intervalo*1000);
     },blanco);
    }

 
function iniciarCronometro(){
 inicioCronometro=Date.now()-tiempoAcumulado;
 cronometro.style.display="block";
 relojCronometro=setInterval(()=>{
  const s=Math.floor((Date.now()-inicioCronometro)/1000);
  const m=Math.floor(s/60);
  const ss=s%60;
  cronometro.textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
 },1000);
}
function pausarCronometro(){clearInterval(relojCronometro);tiempoAcumulado=Date.now()-inicioCronometro;}
function reanudarCronometro(){inicioCronometro=Date.now()-tiempoAcumulado;relojCronometro=setInterval(()=>{const s=Math.floor((Date.now()-inicioCronometro)/1000);const m=Math.floor(s/60);const ss=s%60;cronometro.textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");},1000);}
function detenerCronometro(){
 clearInterval(relojCronometro);
 cronometro.style.display="none";
 cronometro.textContent="00:00";
}

async function iniciar(){
     if(ejecutando) return;
     ejecutando=true;
     panel.style.display="none";
     stop.style.display="block";
     pausa.style.display="block";
     document.body.style.cursor="none";
     try{
       if(!document.fullscreenElement){
          await document.documentElement.requestFullscreen();
       }
     }catch(e){}
     iniciarCronometro();
     ciclo();
    }

    async function detener(){
     ejecutando=false;
     clearTimeout(t1);
     clearTimeout(t2);
     detenerCronometro();
     document.body.style.background="white";
     panel.style.display="block";
     stop.style.display="none";
     pausa.style.display="none";
     document.body.style.cursor="default";
     try{
       if(document.fullscreenElement){
          await document.exitFullscreen();
       }
     }catch(e){}
    }

 
    pausa.onclick=()=>{
      if(!ejecutando) return;
      if(!pausado){
        pausado=true;
        clearTimeout(t1);clearTimeout(t2);
        pausarCronometro();
        document.body.style.background="white";
        pausa.textContent="CONT.";
      }else{
        pausado=false;
        reanudarCronometro();
        pausa.textContent="PAUSA";
        ciclo();
      }
    };

play.onclick=iniciar;
    stop.onclick=detener;

    document.addEventListener("fullscreenchange",()=>{
     if(!document.fullscreenElement && ejecutando){
        detener();
     }
    });

</script>

</body>

</html>
