<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXPO REACT 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ==========================================================
   HOJA DE ESTILO (CSS)
   ========================================================== */
/* ESTILOS GENERALES */
body{font-family:"Manrope",sans-serif;margin:20px}
#cfg{max-width:700px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#arrows{display:grid;grid-template-columns:repeat(8,56px);justify-content:center;gap:8px}
#numbers{display:grid;grid-template-columns:repeat(4,72px);justify-content:center;gap:14px}
.arrow-card{display:flex;justify-content:center;align-items:center;width:56px;height:56px;padding:0;margin:auto;border:1px solid #ccc;border-radius:12px;box-sizing:border-box;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;position:relative}
.number-card{display:flex;justify-content:center;align-items:center;width:72px;height:72px;padding:0;margin:0;border:none;border-radius:10px;box-sizing:border-box;background:transparent;cursor:pointer;transition:transform .18s ease;position:relative;box-shadow:none}
.number-card::before{content:"";width:68px;height:56px;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,.15);box-shadow:-4px -4px 10px rgba(255,255,255,.85),10px 12px 26px rgba(0,0,0,.32);position:absolute;transition:transform .18s ease,box-shadow .18s ease,border .18s ease;}
.arrow-card:hover{transform:scale(1.10)}
.number-card:hover::before{transform:scale(1.15);box-shadow:-4px -4px 11px rgba(255,255,255,.90),12px 14px 30px rgba(0,0,0,.36)}
.arrow-card:has(input:checked){background:#D9FCA2;box-shadow:0 0 18px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.30)}
.number-card:has(input:checked)::before{transform:scale(1.22);background:#D9FCA2;border:2px solid #222;box-shadow:-5px -5px 12px rgba(255,255,255,.95),14px 16px 34px rgba(0,0,0,.40)}
.arrow-card input,.number-card input{display:none}
.number-card span{position:relative;z-index:1;font-size:30px;font-weight:bold;}
.arrow-card svg{width:28px;height:28px;transition:transform .18s ease}

.arrow-card span{font-size:30px;font-weight:bold;font-weight:bold;transition:transform .18s ease}.arrow-card:hover span,.arrow-card:has(input:checked) span{transform:scale(1.2)}
label{border:1px solid #ccc;padding:8px;border-radius:6px}
#stage{display:none;position:fixed;inset:0;justify-content:center;align-items:center;background:#fff}
#num{font-size:45vh;font-weight:800;display:none}
#shape{display:none;font-size:30vh;font-weight:800;text-align:center;line-height:1;align-items:center;justify-content:center}
#shape svg{width:70vh;height:70vh;display:block;overflow:visible}


#arrow{width:32vh;height:32vh;display:none}#arrow svg{width:100%;height:100%;display:block}
button{padding:8px 16px}


/* TARJETAS DE COLORES */
.color-card{
display:flex;justify-content:center;align-items:center;
width:72px;height:72px;background:transparent;border:none;
cursor:pointer;transition:transform .18s ease;position:relative;
margin:0;padding:0;box-shadow:none;
}
.color-card input{position:absolute;opacity:0}
.color-card .swatch{
opacity:0.8;
filter:saturate(1.35);
width:60px;
height:50px;
border-radius:10px;
border:1px solid rgba(0,0,0,.15);
transition:transform .18s ease, box-shadow .18s ease;
box-shadow:
    -4px -4px 10px rgba(255,255,255,.85),
     10px 12px 26px rgba(0,0,0,.32);
}
.color-card:hover .swatch{
transform:scale(1.15);
box-shadow:
    -4px -4px 11px rgba(255,255,255,.90),
     12px 14px 30px rgba(0,0,0,.36);
}
.color-card:has(input:checked) .swatch{
opacity:1;
transform:scale(1.22);
box-shadow:
    -5px -5px 12px rgba(255,255,255,.95),
     14px 16px 34px rgba(0,0,0,.40);

border:2px solid #222;
}


/* PANEL DE CONFIGURACIÓN */
body{background:#eef2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;box-sizing:border-box}
#cfg{max-width:600px;width:100%;margin:0;background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:10px}
.banner{
background:linear-gradient(135deg,#ff5b63,#d32335 48%,#8e1020)!important;
color:#fff;font-family:"Space Grotesk",sans-serif;font-size:54px!important;
font-weight:700!important;letter-spacing:.08em;line-height:.90;transform:scaleY(.90);
text-align:center;padding:20px 30px 18px!important;border-radius:22px!important;
border:1px solid rgba(255,255,255,.28);
box-shadow:0 18px 42px rgba(160,22,38,.29), inset 0 1px rgba(255,255,255,.35);
position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(rgba(255,255,255,.20),transparent)}
.banner::after{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-90px;border-radius:50%;background:rgba(255,255,255,.10)}
.section-title{
display:inline-block;
background:#3a3a3a;
color:#fff;
padding:3px 18px;
border-radius:8px;
font-weight:normal;
font-size:20px;
line-height:1.2;
margin:0 auto;
text-align:center;
box-shadow:
    -2px -2px 5px rgba(255,255,255,.45),
     4px 5px 10px rgba(0,0,0,.28);
}
.section-wrap{text-align:center;}
#start{display:block;margin:12px auto 0;background:#000;color:#fff;font-size:32px;padding:6px 100px;border:none;border-radius:12px;transition:all .18s ease;cursor:pointer}
#start:hover{background:#3a3a3a;transform:translateY(4px);}
#start:disabled{
  opacity:.72 !important;
  cursor:not-allowed;
  color:rgba(255,255,255,.82) !important;
  background:linear-gradient(135deg,#70757c 0%,#575c63 46%,#3d4249 100%) !important;
  border:1px solid rgba(255,255,255,.22) !important;
  box-shadow:
    8px 8px 18px rgba(70,70,70,.24),
    inset 0 2px 0 rgba(255,255,255,.30),
    inset 0 -10px 16px rgba(0,0,0,.20) !important;
  backdrop-filter:blur(10px) saturate(140%) !important;
  -webkit-backdrop-filter:blur(10px) saturate(140%) !important;
}


/* CONTROLES DE VELOCIDAD */
#minus,#plus{
width:46px;height:46px;background:#e4e4e4;border:none;border-radius:50%;font-weight:400;font-size:34px;line-height:46px;cursor:pointer;transition:all .18s ease;box-shadow:-2px -2px 5px rgba(255,255,255,.45),4px 5px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0;}
#minus:hover,#plus:hover{
background:#b8b8b8;
transform:translateY(2px) scale(1.06);
}

.speed-row{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin:0;
}
#time{min-width:90px;text-align:center;font-weight:400;display:inline-block;font-size:28px}


#reset{

margin:10px auto 0;
width:46px;height:46px;
border:none;
border-radius:50%;
background:#e4e4e4;

cursor:pointer;
box-shadow:-2px -2px 5px rgba(255,255,255,.45),4px 5px 10px rgba(0,0,0,.18);
transition:all .18s ease;

display:flex;
align-items:center;
justify-content:center;
padding:0;
}
#reset svg{width:34px;height:34px;display:block;}
#reset:hover{background:#cfcfcf;transform:scale(1.12);}


.start-row{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
margin-top:0;
}
.start-row #start{
grid-column:2;
margin:0;
justify-self:center;
}
.start-row #reset{
grid-column:3;
justify-self:center;
margin:0;
}

/* PANTALLA DE CUENTA ATRÁS */
#countdown{
position:fixed;inset:0;display:none;
justify-content:center;align-items:center;
background:#fff;color:#000;
font-size:45vh;font-weight:800;z-index:9999;
}


 .colors-grid{display:flex;justify-content:center;gap:14px;margin:0;
}

/* CRONÓMETRO Y BADGES */
#timerBox{position:fixed;top:18px;right:18px;background:rgba(0,0,0,.55);color:#fff;padding:2px 0;border-radius:10px;font-family:"Manrope",sans-serif;font-size:22px;font-weight:400;letter-spacing:0;z-index:10001;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);width:96px;box-sizing:border-box;text-align:center;font-variant-numeric:tabular-nums;}


#pauseBtn:focus,
#pauseBtn:focus-visible{
outline:none !important;
box-shadow:none !important;
}
#pauseBtn:hover{
background:rgba(45,45,45,.75)!important;
transform:translateY(2px) scale(1.06);
}
#exitBtn:hover{
background:rgba(45,45,45,.75)!important;
transform:translateY(2px) scale(1.06);
}

#minusStage:hover,#plusStage:hover{
background:rgba(40,40,40,.75)!important;
transform:scale(1.08);
}


/* CURSOR PERSONALIZADO */
#stage{cursor:none;}
#cursorCircle{
position:fixed;
width:18px;
height:18px;
border-radius:50%;
background:rgba(0,0,0,.30);
pointer-events:none;
transform:translate(-50%,-50%);
z-index:100000;
display:none;
}

/* ================= FIN HOJA DE ESTILO ================= */

/* ==========================================================
   AJUSTES V16: HOVER DE FORMAS Y SOMBRAS UNIFICADAS
   ========================================================== */

/* Patrón común de sombra de las tarjetas de formas */
:root{
  --card-shadow:
    -4px -4px 10px rgba(255,255,255,.85),
     10px 12px 26px rgba(0,0,0,.32);
  --card-shadow-hover:
    -4px -4px 11px rgba(255,255,255,.90),
     12px 14px 30px rgba(0,0,0,.36);
  --card-shadow-selected:
    -5px -5px 12px rgba(255,255,255,.95),
     14px 16px 34px rgba(0,0,0,.40);
}

/* NÚMEROS: mismo patrón de sombras que los recuadros de formas */
.number-card::before{
  box-shadow:var(--card-shadow);
}
.number-card:hover::before{
  transform:scale(1.06);
  box-shadow:var(--card-shadow-hover);
  border:1px solid rgba(0,0,0,.15);
}
.number-card:has(input:checked)::before{
  box-shadow:var(--card-shadow-selected);
}

/* FLECHAS: mismo relieve, hover y selección que las formas */
.arrow-card{
  background:#fff;
  border:1px solid rgba(0,0,0,.15);
  box-shadow:var(--card-shadow);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.arrow-card:hover{
  transform:scale(1.06);
  border:1px solid rgba(0,0,0,.15);
  box-shadow:var(--card-shadow-hover);
}
.arrow-card:has(input:checked){
  background:#D9FCA2;
  border:2px solid #222;
  box-shadow:var(--card-shadow-selected);
}


/* ==========================================================
   V22: TARJETAS DE FORMAS SIN CAMBIO DE TAMAÑO
   ========================================================== */
#shapes{display:flex;justify-content:center;gap:20px !important;margin:0;
}

#shapes .color-card,
#shapes .color-card:hover,
#shapes .color-card:has(input:checked),
#shapes .color-card:has(input:checked):hover{
  width:64px !important;
  height:64px !important;
  margin:0 !important;
  padding:0 !important;
  border:none !important;
  background:transparent !important;
  box-shadow:none !important;
  transform:none !important;
  overflow:visible;
  box-sizing:border-box !important;
}

#shapes .color-card .swatch,
#shapes .color-card:hover .swatch,
#shapes .color-card:has(input:checked) .swatch,
#shapes .color-card:has(input:checked):hover .swatch{
  width:54px !important;
  height:46px !important;
  border:1px solid rgba(0,0,0,.15) !important;
  border-radius:10px !important;
  box-sizing:border-box !important;
  transform:none !important;
  transition:box-shadow .18s ease, opacity .18s ease !important;
}

#shapes .color-card .swatch{
  opacity:.8;
  box-shadow:var(--card-shadow);
}

#shapes .color-card:hover .swatch{
  opacity:.8;
  box-shadow:var(--card-shadow-hover);
}

#shapes .color-card:has(input:checked) .swatch,
#shapes .color-card:has(input:checked):hover .swatch{
  opacity:1;
  box-shadow:var(--card-shadow-selected);
}

#shapes .shape-preview,
#shapes .color-card:hover .shape-preview,
#shapes .color-card:has(input:checked) .shape-preview,
#shapes .color-card:has(input:checked):hover .shape-preview{
  width:50px !important;
  height:50px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  transform:none !important;
}

#shapes .shape-preview svg,
#shapes .color-card:hover .shape-preview svg,
#shapes .color-card:has(input:checked) .shape-preview svg,
#shapes .color-card:has(input:checked):hover .shape-preview svg{
  width:44px !important;
  height:44px !important;
  display:block !important;
  transform:none !important;
  transition:none !important;
  overflow:visible;
}


/* ==========================================================
   V25: PANEL INICIAL EQUIDISTANTE
   ========================================================== */
body{
  min-height:100vh;
  margin:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eef2f5;
  box-sizing:border-box;
}

#cfg{
  width:min(600px, calc(100vw - 32px));
  max-width:600px;
  margin:0 auto !important;
  padding:18px !important;
  display:grid !important;
  grid-template-columns:1fr;
  row-gap:12px !important;
  align-content:center;
  box-sizing:border-box;
  transform:scale(.65);
  transform-origin:center;
}

/* El banner participa en la misma retícula */
#cfg .banner{
  margin:0 !important;
}

/* Cada título ocupa una fila propia sin márgenes desiguales */
#cfg .section-wrap{
  margin:0 !important;
  padding:0 !important;
  line-height:1;
}

#cfg .section-title{
  margin:0 !important;
}

/* Todas las filas de contenido usan el mismo espacio vertical */
#cfg #colors,
#cfg #arrows,
#cfg #numbers,
#cfg #shapes,
#cfg .speed-row,
#cfg .start-row{
  margin:0 !important;
}

/* Unificación interna de filas */
#cfg #colors,
#cfg #shapes{
  margin-top:0 !important;
  margin-bottom:0 !important;
}

#cfg .speed-row{
  min-height:52px;
}

#cfg .start-row{
  margin-top:0 !important;
  min-height:52px;
}

/* Evita que elementos internos introduzcan huecos extra */
#cfg p{
  margin-block-start:0 !important;
  margin-block-end:0 !important;
}

/* BOTÓN DE SONIDO JUNTO A START */
.start-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:0;
}
.start-row #soundToggleBtn{
  grid-column:1;
  justify-self:center;
}
.start-row #start{
  grid-column:2;
  margin:0;
  justify-self:center;
}
.start-row #reset{
  grid-column:3;
  justify-self:center;
  margin:0;
}

#soundToggleBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  background:#e4e4e4;
  color:#222;
  cursor:pointer;
  box-shadow:4px 5px 10px rgba(0,0,0,.18);
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
#soundToggleBtn:hover{
  background:#cfcfcf;
  transform:scale(1.08);
}
#soundToggleBtn.is-muted{
  background:#b9b9b9;
  color:#555;
}
#soundToggleBtn .sound-icon{
  width:28px;
  height:28px;
  display:block;
  transform:translateY(2px);
}
#soundToggleBtn .sound-off-icon{
  display:none;
}
#soundToggleBtn.is-muted .sound-on-icon{
  display:none;
}
#soundToggleBtn.is-muted .sound-off-icon{
  display:block;
}


/* ==========================================================
   REDISEÑO VISUAL ESTILO APPLE / iOS
   ========================================================== */
:root{
  --ios-bg:#F5F5F7;
  --ios-panel:rgba(255,255,255,.92);
  --ios-text:#1D1D1F;
  --ios-secondary:#6E6E73;
  --ios-dark:#2C2C2E;
  --ios-dark-hover:#3A3A3C;
  --ios-accent:#C62D63;
  --ios-accent-hover:#B52859;
  --ios-green:#DDF7B8;
  --ios-border:rgba(0,0,0,.08);
  --ios-shadow:4px 5px 12px rgba(0,0,0,.14),2px 2px 4px rgba(0,0,0,.06);
  --ios-shadow-hover:6px 8px 18px rgba(0,0,0,.18),3px 3px 6px rgba(0,0,0,.08);
  --ios-shadow-panel:0 14px 40px rgba(0,0,0,.12);
  --ios-ease:cubic-bezier(.2,.8,.2,1);
}

html,body{
  background:var(--ios-bg) !important;
  color:var(--ios-text);
}

body{
  font-weight:500;
  letter-spacing:-.01em;
}

#cfg{
  background:var(--ios-panel) !important;
  border:1px solid rgba(255,255,255,.7);
  border-radius:26px !important;
  box-shadow:var(--ios-shadow-panel) !important;
  row-gap:16px !important;
  padding:22px !important;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.banner{
  background:linear-gradient(135deg,#ff4a55 0%,#ff1e33 28%,#d1001f 62%,#8b0016 100%) !important;
  border-radius:32px !important;
  padding:18px 16px !important;
  font-size:34px !important;
  font-weight:500 !important;
  letter-spacing:-.03em;
  box-shadow:
      10px 10px 24px rgba(90,90,90,.35),
      inset 0 2px 0 rgba(255,255,255,.55),
      inset 0 -10px 18px rgba(120,0,0,.18) !important;
  border:1px solid rgba(255,255,255,.35) !important;
  position:relative;
  overflow:hidden;
}
.banner::before{
  content:"";
  position:absolute;
  left:0;top:0;right:0;
  height:48%;
  background:linear-gradient(to bottom,
      rgba(255,255,255,.55),
      rgba(255,255,255,.22) 45%,
      rgba(255,255,255,0));
}
.banner::after{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  top:-170px;
  right:-70px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);
  transform:rotate(-12deg);
}

.section-title{
  background:var(--ios-dark) !important;
  border-radius:12px !important;
  padding:5px 18px !important;
  font-size:19px !important;
  font-weight:500 !important;
  letter-spacing:-.01em;
  box-shadow:none !important;
}

#colors,#arrows,#numbers,#shapes{
  gap:16px !important;
}

.color-card,
.number-card,
.arrow-card{
  transition:transform .16s var(--ios-ease),box-shadow .16s var(--ios-ease),background .16s var(--ios-ease) !important;
}

.color-card .swatch,
.number-card::before,
.arrow-card,
#shapes .color-card .swatch{
  border-radius:14px !important;
  border:1px solid var(--ios-border) !important;
  box-shadow:var(--ios-shadow) !important;
}

.color-card:hover .swatch,
.number-card:hover::before,
.arrow-card:hover,
#shapes .color-card:hover .swatch{
  transform:translateY(-1px) scale(1.02) !important;
  box-shadow:var(--ios-shadow-hover) !important;
}

.number-card:has(input:checked)::before,
.arrow-card:has(input:checked),
#shapes .color-card:has(input:checked) .swatch{
  background:var(--ios-green) !important;
  border:1px solid rgba(0,0,0,.10) !important;
  box-shadow:0 4px 12px rgba(0,0,0,.12) !important;
  transform:none !important;
}

#shapes .color-card,
#shapes .color-card:hover,
#shapes .color-card:has(input:checked),
#shapes .color-card:has(input:checked):hover{
  transform:none !important;
}

#start{
  background:linear-gradient(135deg,#ff4a55 0%,#ff1e33 28%,#d1001f 62%,#8b0016 100%) !important;
  color:#fff !important;
  border-radius:18px !important;
  font-weight:500 !important;
  letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.35) !important;
  box-shadow:
      10px 10px 24px rgba(90,90,90,.35),
      inset 0 2px 0 rgba(255,255,255,.55),
      inset 0 -10px 18px rgba(120,0,0,.18) !important;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  transition:transform .18s var(--ios-ease),box-shadow .18s var(--ios-ease),filter .18s var(--ios-ease) !important;
}

#start::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  right:0;
  height:48%;
  border-radius:inherit;
  background:linear-gradient(to bottom,
      rgba(255,255,255,.55),
      rgba(255,255,255,.22) 45%,
      rgba(255,255,255,0));
  pointer-events:none;
  z-index:-1;
}

#start::after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  top:-92px;
  right:-35px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);
  pointer-events:none;
  z-index:-1;
}

#start:hover{
  transform:translateY(-1px) !important;
  filter:brightness(1.05);
  box-shadow:
      12px 12px 26px rgba(90,90,90,.38),
      inset 0 2px 0 rgba(255,255,255,.60),
      inset 0 -10px 18px rgba(120,0,0,.18) !important;
}

#start:active{
  transform:scale(.985) !important;
}

#start:disabled{
  opacity:.72;
  filter:saturate(.55);
  cursor:not-allowed;
}

#minus,#plus,#reset,#soundToggleBtn{
  background:rgba(118,118,128,.12) !important;
  color:var(--ios-text) !important;
  border:1px solid rgba(0,0,0,.04) !important;
  box-shadow:none !important;
  transition:background .16s var(--ios-ease),transform .16s var(--ios-ease) !important;
}

#minus:hover,#plus:hover,#reset:hover,#soundToggleBtn:hover{
  background:rgba(118,118,128,.20) !important;
  transform:scale(1.04) !important;
}

#minus:active,#plus:active,#reset:active,#soundToggleBtn:active{
  transform:scale(.96) !important;
}

#soundToggleBtn .sound-icon{
  transition:transform .18s var(--ios-ease),opacity .18s var(--ios-ease);
}

#soundToggleBtn.is-muted .sound-icon{
  transform:translateY(2px) rotate(-12deg) !important;
}

#time{
  color:var(--ios-text);
  font-weight:600 !important;
}

#stage{
  background:#fff;
}

#timerBox,
#pauseBtn,
#minusStage,
#plusStage,
#speedBadge,
#stimCounter,
#exitBtn{
  background:rgba(28,28,30,.72) !important;
  color:#fff !important;
  border:1px solid rgba(255,255,255,.18) !important;
  box-shadow:0 6px 22px rgba(0,0,0,.22) !important;
  backdrop-filter:blur(18px) saturate(140%) !important;
  -webkit-backdrop-filter:blur(18px) saturate(140%) !important;
  opacity:1 !important;
}

#timerBox,
#speedBadge,
#stimCounter,
#pauseBtn,
#exitBtn,
#minusStage,
#plusStage{
  border-radius:14px !important;
}

#pauseBtn,
#exitBtn,
#minusStage,
#plusStage{
  transition:background .16s var(--ios-ease),transform .16s var(--ios-ease) !important;
}

#pauseBtn:hover,
#exitBtn:hover,
#minusStage:hover,
#plusStage:hover{
  background:rgba(58,58,60,.92) !important;
  color:#fff !important;
  transform:translateY(-1px) scale(1.025) !important;
}

#pauseBtn:active,
#exitBtn:active,
#minusStage:active,
#plusStage:active{
  transform:scale(.97) !important;
}

#timerBox{
  background:rgba(28,28,30,.78) !important;
}


#pauseBtn span,
#minusStage span,
#plusStage span,
#exitBtn,
#speedBadge,
#stimCounter,
#timerBox{
  color:#fff !important;
  opacity:1 !important;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}

#cursorCircle{
  background:rgba(60,60,67,.30) !important;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    transition:none !important;
    animation:none !important;
  }
}


/* ==========================================================
   AJUSTE: ZOOM DE TARJETAS DE COLOR
   ========================================================== */
#colors .color-card:hover .swatch,
#colors .color-card:has(input:checked) .swatch,
#colors .color-card:has(input:checked):hover .swatch{
  transform:translateY(-1px) scale(1.05) !important;
}

#colors .color-card:has(input:checked) .swatch{
  opacity:1 !important;
  filter:saturate(1.35) !important;
  border:1px solid #555 !important;
  box-shadow:var(--ios-shadow-hover) !important;
}


/* AJUSTE: mantener zoom en todas las tarjetas seleccionadas */
.arrow-card:has(input:checked){
  transform:scale(1.12) !important;
}
.number-card:has(input:checked)::before{
  transform:translateY(-1px) scale(1.20) !important;
}
#colors .color-card:has(input:checked) .swatch{
  transform:translateY(-1px) scale(1.18) !important;
}

/* Cuando una tarjeta de color está seleccionada, el hover no modifica su aspecto */

  transform:translateY(-1px) scale(1.18) !important;

  filter:saturate(1.35) !important;

}

/* ==========================================================
   TARJETAS DE SONIDO
   ========================================================== */
#sounds{
  display:grid;
  grid-template-columns:repeat(5,64px);
  justify-content:center;
  gap:14px 16px !important;
  margin:0 !important;
}
.sound-card{
  display:flex;
  justify-content:center;
  align-items:center;

  height:64px;
  padding:0;
  margin:0;

  border-radius:14px;
  background:#fff;
  box-shadow:var(--ios-shadow);
  cursor:pointer;
  position:relative;
  box-sizing:border-box;
  transition:transform .16s var(--ios-ease),box-shadow .16s var(--ios-ease),background .16s var(--ios-ease) !important;

.sound-card .sound-card-content{

.sound-card:hover{

  box-shadow:var(--ios-shadow-hover) !important;
}
.sound-card:has(input:checked){
  background:linear-gradient(180deg,#FFF7F8 0%,#FCE7EA 50%,#F6D2D8 100%) !important;
  border:1px solid rgba(180,70,80,.14) !important;
  box-shadow:var(--card-shadow-selected) !important;
  backdrop-filter:blur(14px) saturate(140%) !important;
  -webkit-backdrop-filter:blur(14px) saturate(140%) !important;
  transform:scale(1.05) !important;
}

  display:none;
  align-items:center;
  justify-content:center;
  width:36vh;
  height:36vh;
  color:#1d1d1f;
}
#soundStimulus svg{width:100%;height:100%;display:block}


/* COLORES PUROS EN HOVER Y SELECCIÓN */
#colors .color-card:hover .swatch,
#colors .color-card:has(input:checked) .swatch,
#colors .color-card:has(input:checked):hover .swatch{
  background:var(--pure-color) !important;
}


/* ==========================================================
   START INTERACTIVO + TRANSICIÓN PROFESIONAL
   ========================================================== */
#start{
  --mx:50%;
  --my:50%;
  transition:
    transform .22s cubic-bezier(.22,1,.36,1),
    box-shadow .22s cubic-bezier(.22,1,.36,1),
    filter .22s ease,
    opacity .22s ease !important;
  will-change:transform,box-shadow,filter;
}

#start::before{
  background:
    radial-gradient(circle at var(--mx) var(--my),
      rgba(255,255,255,.34) 0%,
      rgba(255,255,255,.14) 18%,
      rgba(255,255,255,0) 46%),
    linear-gradient(to bottom,
      rgba(255,255,255,.52),
      rgba(255,255,255,.20) 45%,
      rgba(255,255,255,0)) !important;
  opacity:.78;
  transition:opacity .18s ease;
}

#start:hover::before{
  opacity:1;
}

#start:active{
  transform:scale(.98) !important;
  animation:startBounce .34s cubic-bezier(.22,1.35,.36,1);
}

@keyframes startBounce{
  0%{transform:scale(1)}
  42%{transform:scale(.98)}
  72%{transform:scale(1.015)}
  100%{transform:scale(1)}
}

#start:disabled{
  opacity:.68 !important;
  filter:saturate(.35) brightness(.72) !important;
  background:linear-gradient(135deg,#7b7f86 0%,#5f646b 46%,#43484f 100%) !important;
  color:rgba(255,255,255,.82) !important;
  border-color:rgba(255,255,255,.30) !important;
  box-shadow:
    6px 7px 16px rgba(90,90,90,.20),
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -7px 14px rgba(60,60,60,.10) !important;
}

#start:disabled::before{
  opacity:.40;
}

#cfg{
  transition:
    opacity .38s ease,
    transform .46s cubic-bezier(.22,1,.36,1),
    filter .38s ease !important;
}

body.training-transition #cfg{
  opacity:0;
  filter:blur(8px);
  transform:scale(.61) translateY(-8px) !important;
  pointer-events:none;
}

#countdown{
  opacity:0;
  transform:scale(1.035);
  transition:
    opacity .34s ease,
    transform .42s cubic-bezier(.22,1,.36,1);
}

#countdown.is-visible{
  opacity:1;
  transform:scale(1);
}


/* ==========================================================

.section-title{

  content:"";

  right:5%;

  height:44%;

    linear-gradient(

  content:"";

  background:

      rgba(255,255,255,.16) 28%,
      rgba(255,255,255,0) 70%
    );

  z-index:-1;
}

/* ==========================================================
   AJUSTE FINAL: NÚMEROS MÁS PEGADOS A LOS ICONOS DE VOZ
   ========================================================== */
.sound-card .sound-card-content{
  gap:1px !important;
  padding-left:3px !important;
  padding-right:3px !important;
}

.sound-card .sound-number{
  margin-left:-4px !important;
}

/* Mantener el 11 bien encajado junto al silbato */
#sounds .sound-card:nth-child(11) .sound-number{
  margin-left:-7px !important;
}


/* Ajuste fino: separar ligeramente los números 2–10 del icono */
#sounds .sound-card:nth-child(n+2):nth-child(-n+10) .sound-number{
  margin-left:-2px !important;
}


/* ==========================================================
   AJUSTES VISUALES: SONIDOS, SELECCIÓN ROJO GLASS Y VELOCIDAD
   ========================================================== */

/* Más zoom al seleccionar una tarjeta de sonido */
.sound-card:has(input:checked),
.sound-card:has(input:checked):hover{
  transform:translateY(-1px) scale(1.12) !important;
  box-shadow:
    0 8px 22px rgba(120,20,30,.22),
    inset 0 1px 0 rgba(255,255,255,.52),
    inset 0 -8px 14px rgba(120,0,12,.10) !important;
}

/* Rojo suave glass para flechas seleccionadas */
.arrow-card:has(input:checked),
.arrow-card:has(input:checked):hover{
  background:
    linear-gradient(180deg,#ffd9dc 0%,#f5aeb5 48%,#df7d88 100%) !important;
  border:1px solid rgba(135,20,32,.25) !important;
  box-shadow:
    8px 9px 18px rgba(110,40,48,.20),
    inset 0 2px 0 rgba(255,255,255,.68),
    inset 0 -8px 14px rgba(135,20,32,.12) !important;
}

/* Rojo suave glass para números seleccionados */
.number-card:has(input:checked)::before,
.number-card:has(input:checked):hover::before{
  background:
    linear-gradient(180deg,#ffd9dc 0%,#f5aeb5 48%,#df7d88 100%) !important;
  border:1px solid rgba(135,20,32,.25) !important;
  box-shadow:
    8px 9px 18px rgba(110,40,48,.20),
    inset 0 2px 0 rgba(255,255,255,.68),
    inset 0 -8px 14px rgba(135,20,32,.12) !important;
}

/* Rojo suave glass para formas seleccionadas */
#shapes .color-card:has(input:checked) .swatch,
#shapes .color-card:has(input:checked):hover .swatch{
  background:
    linear-gradient(180deg,#ffd9dc 0%,#f5aeb5 48%,#df7d88 100%) !important;
  border:1px solid rgba(135,20,32,.25) !important;
  box-shadow:
    8px 9px 18px rgba(110,40,48,.20),
    inset 0 2px 0 rgba(255,255,255,.68),
    inset 0 -8px 14px rgba(135,20,32,.12) !important;
}

/* Botones + y - con acabado glass negro/gris */
#minus,#plus{
  color:#fff !important;
  background:
    linear-gradient(180deg,#55575b 0%,#34363a 48%,#17181b 100%) !important;
  border:1px solid rgba(255,255,255,.25) !important;
  box-shadow:
    7px 8px 16px rgba(60,60,60,.25),
    inset 0 2px 0 rgba(255,255,255,.38),
    inset 0 -8px 12px rgba(0,0,0,.28) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.55);
}

#minus:hover,#plus:hover{
  color:#fff !important;
  background:
    linear-gradient(180deg,#66696e 0%,#414348 48%,#222326 100%) !important;
  box-shadow:
    8px 9px 18px rgba(60,60,60,.30),
    inset 0 2px 0 rgba(255,255,255,.44),
    inset 0 -8px 12px rgba(0,0,0,.30) !important;
}


/* AJUSTES FINOS */
#sounds{
  row-gap:16px !important; /* más separación entre filas */
}

/* Botones + y - */
#minus,#plus{
  font-weight:300 !important;
  text-shadow:0 1px 1px rgba(0,0,0,.18) !important;
}
#minus span,#plus span{
  font-weight:300 !important;
  text-shadow:0 1px 1px rgba(0,0,0,.18) !important;
}


/* PATCH glass sonido */
#minus,#plus{
 border-radius:14px!important;
 background:linear-gradient(180deg,#f8f8f8,#d9d9d9)!important;
 border:1px solid rgba(255,255,255,.45)!important;
 box-shadow:8px 8px 18px rgba(90,90,90,.18), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -8px 14px rgba(0,0,0,.08)!important;
}
#soundToggleBtn{
 border-radius:14px!important;
 background:linear-gradient(180deg,#3b3b3d,#0d0d0f)!important;
 border:1px solid rgba(255,255,255,.28)!important;
 box-shadow:7px 8px 16px rgba(95,95,95,.28), inset 0 1px 0 rgba(255,255,255,.42), inset 0 -7px 12px rgba(0,0,0,.30)!important;
}
#soundToggleBtn img,#soundToggleBtn svg{filter:grayscale(1) brightness(.35)!important;}
#soundToggleBtn:not(.is-muted) img,#soundToggleBtn:not(.is-muted) svg{filter:grayscale(1) brightness(0)!important;}

.sound-card:has(input:checked){
 background:linear-gradient(135deg,#ff5b63,#d32335 48%,#8e1020)!important;
 border:1px solid rgba(255,255,255,.30)!important;
 box-shadow:0 18px 42px rgba(160,22,38,.29), inset 0 1px rgba(255,255,255,.35)!important;
}
.sound-card:has(input:checked)::before{
 content:"";
 position:absolute;left:0;right:0;top:0;height:45%;
 background:linear-gradient(rgba(255,255,255,.25),transparent);
 border-radius:14px;
 pointer-events:none;
}
.sound-card:has(input:checked) .sound-number,
.sound-card:has(input:checked) svg,
.sound-card:has(input:checked) img{
 color:#fff!important;
 filter:brightness(0) invert(1)!important;
}


/* ==========================================================
   AJUSTE FINAL: SONIDO ACTIVO MUY SUAVE + CONTROLES DE VELOCIDAD
   ========================================================== */

/* Tarjeta de sonido activa: rojo glass mucho más tenue */
.sound-card:has(input:checked),
.sound-card:has(input:checked):hover{
  background:
    linear-gradient(
      180deg,
      rgba(255,248,249,.96) 0%,
      rgba(249,218,222,.72) 48%,
      rgba(239,190,197,.58) 100%
    ) !important;
  border:1px solid rgba(176,72,84,.16) !important;
  box-shadow:
    0 7px 18px rgba(145,55,66,.09),
    inset 0 2px 0 rgba(255,255,255,.78),
    inset 0 -7px 12px rgba(176,72,84,.06) !important;
  backdrop-filter:blur(12px) saturate(112%) !important;
  -webkit-backdrop-filter:blur(12px) saturate(112%) !important;
}

/* + y −: negros, ligeros y glass en estado normal */
#minus,#plus{
  color:#fff !important;
  font-weight:300 !important;
  background:
    linear-gradient(180deg,#44464a 0%,#292b2f 48%,#111215 100%) !important;
  border:1px solid rgba(255,255,255,.20) !important;
  border-radius:12px !important;
  box-shadow:
    4px 5px 10px rgba(45,45,45,.16),
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 -6px 10px rgba(0,0,0,.22) !important;
  text-shadow:none !important;

/* ==========================================================

   ========================================================== */
html{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  width:100% !important;
  height:100% !important;
  min-height:100% !important;
  margin:0 !important;
  padding:8px !important;
  overflow:hidden !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  box-sizing:border-box !important;
}

/*
  Se anula el scale fijo anterior. El tamaño lo calcula JavaScript
  según el ancho y alto reales del cuadro creado por Google Sites.
*/
#cfg{
  transform:none !important;
  transform-origin:center center !important;
  zoom:var(--sites-fit, 1);
  flex:0 0 auto !important;
  margin:auto !important;
}

/* En pantallas muy estrechas, evitar desbordamientos internos */
#cfg,
#cfg *{
  box-sizing:border-box;
}

/* La pantalla de entrenamiento ocupa exactamente el iframe */
#stage,
#countdown{
  width:100% !important;
  height:100% !important;
  inset:0 !important;
}

/* Evita desplazamiento horizontal accidental */
body,
#cfg{
  max-width:100%;
}


/* ==========================================================
   CORRECCIÓN iPHONE / iPAD PARA GOOGLE SITES
   ========================================================== */
html,
body{
  width:100% !important;
  height:100% !important;
  min-height:100% !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

/*
  El panel queda centrado respecto al viewport real del iframe.
  Se utiliza transform en vez de zoom porque Safari móvil maneja
  mejor transform dentro de los bloques incrustados de Google Sites.
*/
#cfg{
  position:fixed !important;
  left:50% !important;
  top:50% !important;

  max-width:none !important;
  margin:0 !important;

  transform:

  transform-origin:center center !important;
  will-change:transform;
}

body.training-transition #cfg{
  transform:
    translate(-50%, -50%)
    scale(calc(var(--mobile-fit, .65) * .94))
    translateY(-8px) !important;
}

/* La secuencia usa el viewport visible real */
#stage,
#countdown{
  position:fixed !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  min-width:100% !important;
  min-height:100% !important;
}

  top:max(12px, env(safe-area-inset-top)) !important;
  right:max(12px, env(safe-area-inset-right)) !important;
}

}

<style id="expo-react-fit-total">
/* ==========================================================
   AJUSTE TOTAL AL CUADRO DE GOOGLE SITES
   ========================================================== */
:root{
  --expo-fit:1;
  --expo-vw:100vw;
  --expo-vh:100vh;
}
html,body{
  width:100% !important;
  height:100% !important;
  min-width:0 !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  background:#eef2f5 !important;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
body{
  display:block !important;
  position:relative !important;
}

/* El panel conserva su diseño, pero ocupa el máximo espacio posible */
#cfg{
  position:fixed !important;
  left:50% !important;
  top:50% !important;
  width:600px !important;
  max-width:none !important;
  min-width:600px !important;
  height:auto !important;
  max-height:none !important;
  margin:0 !important;
  zoom:1 !important;
  transform:translate(-50%,-50%) scale(var(--expo-fit)) !important;
  transform-origin:center center !important;
  will-change:transform;
}
body.training-transition #cfg{
  transform:translate(-50%,-50%) scale(calc(var(--expo-fit) * .96)) !important;
}

/* Cuenta atrás y secuencia ocupan todo el iframe */
#stage,#countdown{
  position:fixed !important;
  left:0 !important;
  top:0 !important;
  right:0 !important;
  bottom:0 !important;
  inset:0 !important;
  width:var(--expo-vw) !important;
  height:var(--expo-vh) !important;
  min-width:0 !important;
  min-height:0 !important;
  max-width:none !important;
  max-height:none !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  box-sizing:border-box !important;
}

/* Estímulos adaptados a la dimensión más pequeña del cuadro */
#num{
  font-size:clamp(90px, min(48vw,48vh), 520px) !important;
  line-height:.9 !important;
}
#arrow{
  width:min(58vw,58vh) !important;
  height:min(58vw,58vh) !important;
}
#shape{
  width:min(66vw,66vh) !important;
  height:min(66vw,66vh) !important;
  font-size:min(42vw,42vh) !important;
}
#shape svg{
  width:100% !important;
  height:100% !important;
}
#soundStimulus{
  width:min(70vw,70vh) !important;
  height:min(70vw,70vh) !important;
  max-width:760px !important;
  max-height:760px !important;
}
#soundStimulus .voice-uploaded-icon,
#soundStimulus svg{
  width:min(48vw,48vh) !important;
  height:min(48vw,48vh) !important;
  max-width:520px !important;
  max-height:520px !important;
  object-fit:contain !important;
}
#soundStimulus .sound-number{
  font-size:min(20vw,20vh) !important;
  color:#000 !important;
  line-height:1 !important;
}

/* Controles dentro de las zonas seguras */
#timerBox{
  top:max(10px, env(safe-area-inset-top)) !important;
  right:max(10px, env(safe-area-inset-right)) !important;
}
#pauseBtn,#exitBtn,#minusStage,#plusStage,#speedBadge,#stimCounter{
  max-width:calc(100vw - 20px) !important;
}

@media (orientation:landscape) and (max-height:520px){
  #num{font-size:min(58vw,58vh) !important;}
  #arrow{width:min(66vw,66vh) !important;height:min(66vw,66vh) !important;}
  #shape{width:min(72vw,72vh) !important;height:min(72vw,72vh) !important;}
}
</style>

</head>

  const selectedCount=checks.filter(input=>input.checked).length;

    "aria-label",
    selectedCount<2

}

const cfg=document.getElementById("cfg");
const stage=document.getElementById("stage");
const num=document.getElementById("num");
const arrow=document.getElementById("arrow");
const soundStimulus=document.getElementById("soundStimulus");
let activeVoice=null;
const voiceAudioCache=new Map();

function getVoiceAudio(source){
  if(!source) return null;

  if(!voiceAudioCache.has(source)){
    const audio=new Audio();
    audio.preload="auto";
    audio.src=source;
    audio.load();
    voiceAudioCache.set(source,audio);
  }

  return voiceAudioCache.get(source);
}

function stopActiveVoice(){
  if(activeVoice){
    activeVoice.pause();
    try{
      activeVoice.currentTime=0;
    }catch(error){}
    activeVoice=null;
  }
}

async function playVoice(source){
  stopActiveVoice();

  /* Respeta el botón general de sonido. */
  if(!selectionSoundToggle?.checked) return false;

  const audio=getVoiceAudio(source);
  if(!audio) return false;

  activeVoice=audio;
  audio.muted=false;
  audio.volume=1;

  try{
    audio.currentTime=0;
  }catch(error){}

  try{
    await audio.play();

    audio.addEventListener("ended",()=>{
      if(activeVoice===audio) activeVoice=null;
    },{once:true});

    return true;
  }catch(error){
    /*
      Segundo intento para Safari/iPad/Firefox cuando el primer play()
      coincide con un cambio de estado o repintado.
    */
    try{
      await new Promise(resolve=>setTimeout(resolve,30));

      if(activeVoice!==audio || !selectionSoundToggle?.checked){
        return false;
      }

      audio.load();
      audio.currentTime=0;
      await audio.play();

      audio.addEventListener("ended",()=>{
        if(activeVoice===audio) activeVoice=null;
      },{once:true});

      return true;
    }catch(secondError){
      console.error("No se pudo reproducir la voz:",secondError);
      if(activeVoice===audio) activeVoice=null;
      return false;
    }
  }
}

function getSoundStimulusVisual(label,id){
  const definition=defs[id] || [];
  const displayText=String(definition[3] ?? ((String(label).match(/\d+/)||[""])[0]) ?? "").trim();

      getVoiceAudio(definition[2]);
    }
  });
}

preloadVoiceAudios();

async function run(sessionId){
  const shape = document.getElementById("shape");

  // Solo utiliza índices seleccionados que realmente existan en defs.
  const selected = checks
    .filter(c => c.checked)
    .map(c => Number(c.value))
    .filter(index => Number.isInteger(index) && defs[index]);

  if (!selected.length) {
    stage.style.display = "none";
    cfg.style.display = "grid";
    return;
  }

  let lastIndex = -1;
  let consecutiveCount = 0;
  let isFirstStimulus = true;

  while (stage.style.display === "flex" && sessionId === activeSession) {
    const totalMs = Math.max(100, dur * 1000);
    const blankMs = Math.min(300, totalMs * 0.20);
    const stimulusMs = Math.max(50, totalMs - blankMs);

    stage.style.background = "white";
    num.style.display = "none";
    arrow.style.display = "none";
    shape.style.display = "none";
    soundStimulus.style.display = "none";
    stopActiveVoice();

    /*
      El primer estímulo aparece inmediatamente al terminar la cuenta atrás.
      En las vueltas siguientes se conserva el intervalo blanco normal.
    */
    if(!isFirstStimulus){
      await wait(blankMs, sessionId);
      if(stage.style.display!=="flex" || sessionId!==activeSession) break;
    }

    /*
      Aleatoriedad natural:
      - puede aparecer el mismo estímulo dos veces consecutivas;
      - nunca puede aparecer una tercera vez seguida.
    */
    let selectedIndex;

    if(selected.length>1){
      do{
        selectedIndex=selected[Math.floor(Math.random()*selected.length)];
      }while(
        selectedIndex===lastIndex &&
        consecutiveCount>=2
      );
    }else{
      selectedIndex=selected[0];
    }

    if(selectedIndex===lastIndex){
      consecutiveCount++;
    }else{
      lastIndex=selectedIndex;
      consecutiveCount=1;
    }

    const d = defs[selectedIndex];

    // Si por cualquier motivo la definición no existe, salta esta vuelta
    // en lugar de detener toda la secuencia.
    if (!d) {
      await wait(50, sessionId);
      continue;
    }
    stimCount++;
    updateStim();

    if (d[0] === "color") {
      stage.style.background = d[2];

    } else if (d[0] === "num") {
      num.textContent = d[2];
      num.style.display = "block";

    } else if (d[0] === "shape") {
      shape.innerHTML = d[1];
      shape.style.color = d[2];
      shape.style.display = "flex";

    } else if (d[0] === "sound") {
      /*
        El estímulo visual y su MP3 correspondiente comienzan juntos.
      */
      soundStimulus.innerHTML=getSoundStimulusVisual(d[1],selectedIndex);
      soundStimulus.style.display="flex";

      requestAnimationFrame(()=>{
        if(
          sessionId===activeSession &&
          stage.style.display==="flex" &&
          soundStimulus.style.display==="flex"
        ){
          playVoice(d[2]);
        }
      });

    } else if (d[0] === "arr") {
      arrow.style.display = "block";

      const transforms = {
        90: "translateX(150px)",
        270: "translateX(-150px)",
        0: "translateY(-150px)",
        180: "translateY(150px)",
        45: "translate(150px,-150px)",
        315: "translate(-150px,-150px)",
        135: "translate(150px,150px)",
        225: "translate(-150px,150px)"
      };

      const movement = transforms[d[2]] || "translate(0px,0px)";
      arrow.style.transform = `${movement} rotate(${d[2]}deg)`;
    }

    if(isFirstStimulus){
      isFirstStimulus=false;
    }

    await wait(stimulusMs, sessionId);
  }
}


let timerInt,startMs,elapsed=0,paused=false;
let activeSession=0;

function hideTrainingVisuals(){
  stage.style.background="white";
  num.style.display="none";
  arrow.style.display="none";

  const shapeEl=document.getElementById("shape");
  if(shapeEl) shapeEl.style.display="none";

  soundStimulus.style.display="none";
  stopActiveVoice();
}

function cancelTrainingSession(){
  activeSession++;
  paused=false;
  elapsed=0;

  clearInterval(timerInt);
  timerInt=null;

  const pauseBtn=document.getElementById("pauseBtn");
  if(pauseBtn) setPauseButtonState(false);

  const timerBox=document.getElementById("timerBox");
  if(timerBox){
    timerBox.textContent="00:00";
    timerBox.style.display="none";
  }

  const cd=document.getElementById("countdown");
  if(cd){
    cd.classList.remove("is-visible");
    cd.style.display="none";
    cd.style.opacity="";
    cd.style.visibility="";
    cd.textContent="";
  }

  hideTrainingVisuals();

  stimCount=0;
  updateStim();
}

async function wait(ms, sessionId){
  let remaining=ms;

  while(
    remaining>0 &&
    stage.style.display==="flex" &&
    sessionId===activeSession
  ){
    while(
      paused &&
      stage.style.display==="flex" &&
      sessionId===activeSession
    ){
      await sleep(50);
    }

    if(sessionId!==activeSession || stage.style.display!=="flex") return false;

    const step=Math.min(50,remaining);
    await sleep(step);
    if(!paused) remaining-=step;
  }

  return sessionId===activeSession && stage.style.display==="flex";
}
// ================= INICIO DE LA PRESENTACIÓN =================
function startTimer(sessionId){
  const b=document.getElementById("timerBox");

  elapsed=0;
  paused=false;
  startMs=Date.now();

  b.style.display="flex";
  b.textContent="00:00";

  clearInterval(timerInt);

  timerInt=setInterval(()=>{
    if(sessionId!==activeSession){
      clearInterval(timerInt);
      return;
    }

    if(paused) return;

    elapsed=Date.now()-startMs;
    const e=Math.floor(elapsed/1000);
    const m=String(Math.floor(e/60)).padStart(2,"0");
    const s=String(e%60).padStart(2,"0");
    b.textContent=`${m}:${s}`;
  },250);
}

function stopTimer(){
  clearInterval(timerInt);
  timerInt=null;

  const b=document.getElementById("timerBox");
  if(b){
    b.textContent="00:00";
    b.style.display="none";
  }
}

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function beep(ms){
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.type='sine'; o.frequency.value=1000;
 o.connect(g); g.connect(audioCtx.destination);
 g.gain.value=0.25;
 o.start();
 o.stop(audioCtx.currentTime+ms/1000);
}
async function runCountdown(sessionId){
  const cd=document.getElementById("countdown");

  cd.style.display="flex";
  cd.style.opacity="1";
  cd.style.visibility="visible";
  cd.classList.add("is-visible");
  cd.textContent="3";

  void cd.offsetHeight;
  await new Promise(resolve=>
    requestAnimationFrame(()=>
      requestAnimationFrame(resolve)
    )
  );

  for(const n of [3,2,1]){
    if(sessionId!==activeSession || stage.style.display!=="flex"){
      cd.classList.remove("is-visible");
      cd.style.display="none";
      cd.replaceChildren();
      return false;
    }

    /*
      Se crea un elemento nuevo para cada número.
      Esto obliga al navegador a reproducir la animación desde cero.
    */
    const countdownContent=document.createElement("div");
    countdownContent.className="countdown-content";

    const readyEl=document.createElement("div");
    readyEl.className="countdown-ready";
    readyEl.textContent="READY";

    const numberEl=document.createElement("span");
    numberEl.className="countdown-number";
    numberEl.textContent=String(n);

    countdownContent.append(readyEl,numberEl);
    cd.replaceChildren(countdownContent);

    /* Fuerza el primer fotograma antes de lanzar la animación. */
    void numberEl.offsetWidth;
    numberEl.classList.add("is-animating");

    beep(120);

    const end=performance.now()+1000;

    while(performance.now()<end){
      if(sessionId!==activeSession || stage.style.display!=="flex"){
        cd.classList.remove("is-visible");
        cd.style.display="none";
        cd.textContent="";
        return false;
      }
      await sleep(40);
    }
  }

  if(sessionId!==activeSession || stage.style.display!=="flex"){
    cd.classList.remove("is-visible");
    cd.style.display="none";
    cd.replaceChildren();
    return false;
  }

  /*
    Salida:
    GO aparece solo y coincide exactamente con el pitido final.
    Permanece durante medio segundo antes del primer estímulo.
  */
  const goEl=document.createElement("div");
  goEl.className="countdown-go";
  goEl.textContent="GO";
  cd.replaceChildren(goEl);

  void goEl.offsetWidth;
  goEl.classList.add("is-visible");

  beep(500);

  const goEnd=performance.now()+1000;
  while(performance.now()<goEnd){
    if(sessionId!==activeSession || stage.style.display!=="flex"){
      cd.classList.remove("is-visible");
      cd.style.display="none";
      cd.replaceChildren();
      return false;
    }
    await sleep(25);
  }

  cd.classList.remove("is-visible");
  cd.style.display="none";
  cd.style.opacity="";
  cd.style.visibility="";
  cd.replaceChildren();

  return true;
}

async function ensureAudioReady() {
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
}

function createSoftClick(context, startTime) {
  // Cuerpo principal: dos tonos muy breves y suaves.
  const osc1 = context.createOscillator();
  const osc2 = context.createOscillator();
  const gain1 = context.createGain();
  const gain2 = context.createGain();

  osc1.type = "sine";
  osc2.type = "triangle";

  osc1.frequency.setValueAtTime(980, startTime);
  osc1.frequency.exponentialRampToValueAtTime(720, startTime + 0.045);

  osc2.frequency.setValueAtTime(1480, startTime);
  osc2.frequency.exponentialRampToValueAtTime(1020, startTime + 0.035);

  gain1.gain.setValueAtTime(0.0001, startTime);
  gain1.gain.exponentialRampToValueAtTime(0.18, startTime + 0.004);
  gain1.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.06);

  gain2.gain.setValueAtTime(0.0001, startTime);
  gain2.gain.exponentialRampToValueAtTime(0.08, startTime + 0.003);
  gain2.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.04);

  osc1.connect(gain1).connect(context.destination);
  osc2.connect(gain2).connect(context.destination);

  osc1.start(startTime);
  osc2.start(startTime);
  osc1.stop(startTime + 0.065);
  osc2.stop(startTime + 0.045);

  // Ataque sutil de ruido para dar sensación de "tap".
  const duration = 0.018;
  const frameCount = Math.max(1, Math.floor(context.sampleRate * duration));
  const buffer = context.createBuffer(1, frameCount, context.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < frameCount; i++) {
    const envelope = Math.pow(1 - i / frameCount, 5);
    data[i] = (Math.random() * 2 - 1) * envelope;
  }

  const noise = context.createBufferSource();
  const bandpass = context.createBiquadFilter();
  const noiseGain = context.createGain();

  bandpass.type = "bandpass";
  bandpass.frequency.setValueAtTime(2400, startTime);
  bandpass.Q.setValueAtTime(0.9, startTime);

  noiseGain.gain.setValueAtTime(0.11, startTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  noise.buffer = buffer;
  noise.connect(bandpass).connect(noiseGain).connect(context.destination);
  noise.start(startTime);
  noise.stop(startTime + duration);
}

<script>
(() => {
  const startBtn = document.getElementById("start");
  const cfg = document.getElementById("cfg");
  const countdown = document.getElementById("countdown");
  if (!startBtn || !cfg || !countdown) return;

  startBtn.addEventListener("pointermove", (event) => {
    if (startBtn.disabled) return;
    const rect = startBtn.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 100;
    const y = ((event.clientY - rect.top) / rect.height) * 100;
    startBtn.style.setProperty("--mx", `${x}%`);
    startBtn.style.setProperty("--my", `${y}%`);
  });

  startBtn.addEventListener("pointerleave", () => {
    startBtn.style.setProperty("--mx", "50%");
    startBtn.style.setProperty("--my", "50%");
  });

  startBtn.addEventListener("click", () => {
    if (startBtn.disabled) return;

    document.body.classList.add("training-transition");

    const revealCountdown = () => {
      if (getComputedStyle(countdown).display !== "none") {
        countdown.classList.add("is-visible");
      }
    };

    requestAnimationFrame(() => {
      requestAnimationFrame(revealCountdown);
    });

    const observer = new MutationObserver(() => {
      if (getComputedStyle(countdown).display !== "none") {
        countdown.classList.add("is-visible");
      } else {
        countdown.classList.remove("is-visible");
      }

      const stage = document.getElementById("stage");
      if (stage && getComputedStyle(stage).display !== "none") {
        document.body.classList.remove("training-transition");
        observer.disconnect();
      }
    });

    observer.observe(countdown, {attributes:true, attributeFilter:["style","class"]});
    const stage = document.getElementById("stage");
    if (stage) observer.observe(stage, {attributes:true, attributeFilter:["style","class"]});

    setTimeout(() => {
      document.body.classList.remove("training-transition");
    }, 1800);
  }, {capture:true});
})();
</script>


<script>
/* Ajuste automático al tamaño del bloque de Google Sites */
(function () {
  const cfg = document.getElementById("cfg");
  if (!cfg) return;

  let frameRequest = 0;

  function fitExpoReactToEmbedLegacy() {
    cancelAnimationFrame(frameRequest);

    frameRequest = requestAnimationFrame(() => {
      /* Medir el panel a tamaño natural */
      cfg.style.setProperty("--sites-fit", "1");

      const naturalWidth = cfg.offsetWidth;
      const naturalHeight = cfg.offsetHeight;

      const availableWidth = Math.max(280, window.innerWidth - 16);
      const availableHeight = Math.max(280, window.innerHeight - 16);

      const scaleX = availableWidth / naturalWidth;
      const scaleY = availableHeight / naturalHeight;

      /*
        Ajusta por ancho y alto. Se permite ampliar ligeramente en
        cuadros grandes, pero se evita un zoom excesivo.
      */
      const fit = Math.max(0.32, Math.min(scaleX, scaleY, 1.12));

      cfg.style.setProperty("--sites-fit", fit.toFixed(4));
    });
  }

  window.addEventListener("load", fitExpoReactToEmbedLegacy);
  window.addEventListener("resize", fitExpoReactToEmbedLegacy);
  window.addEventListener("orientationchange", fitExpoReactToEmbedLegacy);

  if (window.ResizeObserver) {
    const observer = new ResizeObserver(fitExpoReactToEmbedLegacy);
    observer.observe(document.documentElement);
  }

  /* Recalcular tras cargar fuentes y recursos incrustados */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitExpoReactToEmbedLegacy);
  }

  setTimeout(fitExpoReactToEmbedLegacy, 100);
  setTimeout(fitExpoReactToEmbedLegacy, 500);
})();
</script>


<script>
/* Ajuste robusto para Safari móvil, iPhone, iPad y Google Sites */
(function () {
  const cfg = document.getElementById("cfg");
  if (!cfg) return;

  let rafId = 0;

  function viewportSize() {
    const vv = window.visualViewport;
    return {
      width: vv ? vv.width : document.documentElement.clientWidth,
      height: vv ? vv.height : document.documentElement.clientHeight
    };
  }

  function fitExpoReactMobile() {
    cancelAnimationFrame(rafId);

    rafId = requestAnimationFrame(() => {
      const viewport = viewportSize();

      /*
        Tamaño natural del panel:
        ancho fijo de diseño = 600 px.
        scrollHeight conserva la altura completa aunque el panel esté escalado.
      */
      const naturalWidth = 600;
      const naturalHeight = Math.max(cfg.scrollHeight, cfg.offsetHeight, 760);

      /*
        Más margen lateral en iPhone para que sombras y tarjetas nunca
        queden cortadas. En iPad el margen puede ser algo menor.
      */
      const narrow = viewport.width <= 480;
      const sidePadding = narrow ? 20 : 24;
      const verticalPadding = narrow ? 16 : 22;

      const usableWidth = Math.max(240, viewport.width - sidePadding * 2);
      const usableHeight = Math.max(260, viewport.height - verticalPadding * 2);

      const fitX = usableWidth / naturalWidth;
      const fitY = usableHeight / naturalHeight;

      /*
        Siempre manda la dimensión más restrictiva.
        No se amplía por encima de 1 para evitar que iPad corte el panel.
      */
      let fit = Math.min(fitX, fitY, 1);

      /* Pequeño margen de seguridad extra para Safari/iFrame */
      fit *= narrow ? 0.96 : 0.98;
      fit = Math.max(0.28, fit);

      cfg.style.setProperty("--mobile-fit", fit.toFixed(4));

      /*
        visualViewport puede desplazarse cuando Safari muestra/oculta barras.
        Centramos respecto a su zona visible real.
      */
      if (window.visualViewport) {
        const vv = window.visualViewport;
        cfg.style.left = (vv.offsetLeft + vv.width / 2) + "px";
        cfg.style.top = (vv.offsetTop + vv.height / 2) + "px";
      } else {
        cfg.style.left = "50%";
        cfg.style.top = "50%";
      }
    });
  }

  window.addEventListener("load", fitExpoReactMobile, { passive:true });
  window.addEventListener("resize", fitExpoReactMobile, { passive:true });
  window.addEventListener("orientationchange", () => {
    setTimeout(fitExpoReactMobile, 80);
    setTimeout(fitExpoReactMobile, 350);
  }, { passive:true });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitExpoReactMobile, { passive:true });
    window.visualViewport.addEventListener("scroll", fitExpoReactMobile, { passive:true });
  }

  if (window.ResizeObserver) {
    const resizeObserver = new ResizeObserver(fitExpoReactMobile);
    resizeObserver.observe(cfg);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitExpoReactMobile);
  }

  fitExpoReactMobile();
  setTimeout(fitExpoReactMobile, 120);
  setTimeout(fitExpoReactMobile, 700);
})();
</script>


<script id="expo-react-fit-total-script">
(function(){
  const cfg=document.getElementById('cfg');
  if(!cfg) return;
  let raf=0;

  function getViewport(){
    const vv=window.visualViewport;
    return {
      width:Math.max(1, vv ? vv.width : document.documentElement.clientWidth || window.innerWidth),
      height:Math.max(1, vv ? vv.height : document.documentElement.clientHeight || window.innerHeight),
      left:vv ? vv.offsetLeft : 0,
      top:vv ? vv.offsetTop : 0
    };
  }

  function fitAll(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(function(){
      const vp=getViewport();
      document.documentElement.style.setProperty('--expo-vw',vp.width+'px');
      document.documentElement.style.setProperty('--expo-vh',vp.height+'px');

      /* Medición natural sin escala */
      cfg.style.setProperty('--expo-fit','1');
      const naturalWidth=Math.max(600,cfg.scrollWidth,cfg.offsetWidth);
      const naturalHeight=Math.max(1,cfg.scrollHeight,cfg.offsetHeight);

      const narrow=vp.width<520;
      const padX=narrow ? 10 : 16;
      const padY=narrow ? 10 : 16;
      const usableW=Math.max(220,vp.width-padX*2);
      const usableH=Math.max(240,vp.height-padY*2);

      /* Usa la dimensión más restrictiva y aprovecha casi todo el cuadro */
      let fit=Math.min(usableW/naturalWidth,usableH/naturalHeight);
      fit=Math.max(.20,Math.min(fit,1.35));
      cfg.style.setProperty('--expo-fit',fit.toFixed(5));

      /* Centrado respecto al viewport visible real de Safari */
      cfg.style.left=(vp.left+vp.width/2)+'px';
      cfg.style.top=(vp.top+vp.height/2)+'px';

      const stage=document.getElementById('stage');
      const countdown=document.getElementById('countdown');
      [stage,countdown].forEach(function(el){
        if(!el) return;
        el.style.left=vp.left+'px';
        el.style.top=vp.top+'px';
        el.style.width=vp.width+'px';
        el.style.height=vp.height+'px';
      });
    });
  }

  window.addEventListener('load',fitAll,{passive:true});
  window.addEventListener('resize',fitAll,{passive:true});
  window.addEventListener('orientationchange',function(){
    setTimeout(fitAll,60);
    setTimeout(fitAll,320);
    setTimeout(fitAll,800);
  },{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',fitAll,{passive:true});
    visualViewport.addEventListener('scroll',fitAll,{passive:true});
  }
  if(window.ResizeObserver){
    const ro=new ResizeObserver(fitAll);
    ro.observe(cfg);
    ro.observe(document.documentElement);
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitAll);}
  fitAll();
  setTimeout(fitAll,100);
  setTimeout(fitAll,500);
})();
</script>

      const fitX = (vp.width - side * 2) / naturalWidth;
      const fitY = (vp.height - vertical * 2) / naturalHeight;

      let fit = Math.min(fitX, fitY);

      /* En pantallas grandes puede ampliarse ligeramente */
      const maxFit = vp.width >= 1100 && vp.height >= 850 ? 1.12 : 1;
      fit = Math.max(.28, Math.min(fit, maxFit));

      cfg.style.setProperty("--app-fit", fit.toFixed(4));
      cfg.style.left = (vp.offsetLeft + vp.width / 2) + "px";
      cfg.style.top = (vp.offsetTop + vp.height / 2) + "px";
    });
  }

  function syncTrainingState(){
    const visible = stage && getComputedStyle(stage).display !== "none";
    document.body.classList.toggle("training-active", visible);
    if(fullscreenBtn) fullscreenBtn.style.display = visible ? "flex" : "none";
  }

  async function toggleFullscreen(){
    try{
      if(!document.fullscreenElement){
        const target = document.documentElement;
        if(target.requestFullscreen){
          await target.requestFullscreen({navigationUI:"hide"});
        }else if(target.webkitRequestFullscreen){
          target.webkitRequestFullscreen();
        }
      }else{
        if(document.exitFullscreen){
          await document.exitFullscreen();
        }else if(document.webkitExitFullscreen){
          document.webkitExitFullscreen();
        }
      }
    }catch(err){
      console.warn("No se pudo activar pantalla completa:", err);
    }
  }

  fullscreenBtn?.addEventListener("click", toggleFullscreen);

  window.addEventListener("load", ()=>{
    fitApp();
    syncTrainingState();
  }, {passive:true});
  window.addEventListener("resize", fitApp, {passive:true});
  window.addEventListener("orientationchange", ()=>{
    setTimeout(fitApp,80);
    setTimeout(fitApp,350);
  }, {passive:true});

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", fitApp, {passive:true});
    window.visualViewport.addEventListener("scroll", fitApp, {passive:true});
  }

  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=>{
      fitApp();
      syncTrainingState();
    });
    ro.observe(cfg);
    if(stage) ro.observe(stage);
  }

  if(window.MutationObserver && stage){
    const mo = new MutationObserver(syncTrainingState);
    mo.observe(stage,{attributes:true,attributeFilter:["style","class"]});
  }

  document.addEventListener("fullscreenchange", ()=>{
    if(fullscreenBtn){
      fullscreenBtn.title = document.fullscreenElement
        ? "Salir de pantalla completa"
        : "Pantalla completa";
      fullscreenBtn.setAttribute(
        "aria-label",
        document.fullscreenElement
          ? "Salir de pantalla completa"
          : "Pantalla completa"
      );
    }
    fitApp();
  });

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitApp);
  }

  fitApp();
  setTimeout(fitApp,120);
  setTimeout(fitApp,700);
})();
</script>


<script>
/* Ajuste final para PC, iPhone e iPad */
(function(){
  const cfg = document.getElementById("cfg");
  if(!cfg) return;

  let rafId = 0;

  function getViewport(){
    const vv = window.visualViewport;
    return {
      width: vv ? vv.width : document.documentElement.clientWidth,
      height: vv ? vv.height : document.documentElement.clientHeight,
      offsetLeft: vv ? vv.offsetLeft : 0,
      offsetTop: vv ? vv.offsetTop : 0
    };
  }

  function fitExpoReact(){
    cancelAnimationFrame(rafId);

    rafId = requestAnimationFrame(()=>{
      const vp = getViewport();

      /*
        Se mide el panel en su tamaño natural. El ancho de diseño es
        600 px; la altura real se obtiene del contenido completo.
      */
      const naturalWidth = 600;
      const naturalHeight = Math.max(cfg.scrollHeight, cfg.offsetHeight, 760);

      const isPhone = vp.width <= 480;
      const isTablet = vp.width >= 700 && vp.width <= 1400;

      const sidePadding = isPhone ? 14 : isTablet ? 20 : 24;
      const verticalPadding = vp.height <= 520 ? 10 : isPhone ? 14 : 20;

      const usableWidth = Math.max(260, vp.width - sidePadding * 2);
      const usableHeight = Math.max(300, vp.height - verticalPadding * 2);

      const fitX = usableWidth / naturalWidth;
      const fitY = usableHeight / naturalHeight;

      let maxScale = 1;
      if(isTablet && vp.height >= 800) maxScale = 1.08;
      if(vp.width >= 1200 && vp.height >= 900) maxScale = 1.12;

      let fit = Math.min(fitX, fitY, maxScale);

      /* Margen de seguridad para Safari móvil y sombras */
      if(isPhone) fit *= .97;
      else if(isTablet) fit *= .985;

      fit = Math.max(.28, fit);

      cfg.style.setProperty("--expo-fit", fit.toFixed(4));
      cfg.style.left = (vp.offsetLeft + vp.width / 2) + "px";
      cfg.style.top = (vp.offsetTop + vp.height / 2) + "px";
    });
  }

  window.addEventListener("load", fitExpoReact, {passive:true});
  window.addEventListener("resize", fitExpoReact, {passive:true});
  window.addEventListener("orientationchange", ()=>{
    setTimeout(fitExpoReact, 80);
    setTimeout(fitExpoReact, 350);
  }, {passive:true});

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", fitExpoReact, {passive:true});
    window.visualViewport.addEventListener("scroll", fitExpoReact, {passive:true});
  }

  if(window.ResizeObserver){
    const observer = new ResizeObserver(fitExpoReact);
    observer.observe(cfg);
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitExpoReact);
  }

  fitExpoReact();
  setTimeout(fitExpoReact,120);
  setTimeout(fitExpoReact,600);
})();
</script>


<script>
/* Ajusta automáticamente los controles inferiores a una sola línea. */
(function(){
  const controls=document.getElementById("controls");
  const stage=document.getElementById("stage");
  if(!controls) return;

  let controlsFitFrame=0;

  function getVisibleViewport(){
    const vv=window.visualViewport;
    return {
      width:vv ? vv.width : document.documentElement.clientWidth,
      offsetLeft:vv ? vv.offsetLeft : 0
    };
  }

  function fitSequenceControls(){
    cancelAnimationFrame(controlsFitFrame);

    controlsFitFrame=requestAnimationFrame(()=>{
      const viewport=getVisibleViewport();

      /*
        Primero se mide la barra a tamaño natural. Como utiliza
        max-content y no permite saltos de línea, scrollWidth representa
        el ancho completo de todos los controles en una sola fila.
      */
      controls.style.setProperty("--sequence-controls-fit","1");

      const naturalWidth=Math.max(
        controls.scrollWidth,
        controls.getBoundingClientRect().width
      );

      const sideMargin=viewport.width<=520 ? 8 : 16;
      const availableWidth=Math.max(240,viewport.width-sideMargin*2);

      let fit=Math.min(1,availableWidth/naturalWidth);

      /* Pequeño margen para redondeos de Safari y Firefox. */
      if(fit<1) fit*=0.985;

      fit=Math.max(0.72,fit);

      controls.style.setProperty(
        "--sequence-controls-fit",
        fit.toFixed(4)
      );

      /*
        visualViewport evita desplazamientos cuando Safari cambia
        el tamaño de sus barras superior e inferior.
      */
      if(window.visualViewport){
        controls.style.left=
          (viewport.offsetLeft+viewport.width/2)+"px";
      }else{
        controls.style.left="50%";
      }
    });
  }

  window.addEventListener("load",fitSequenceControls,{passive:true});
  window.addEventListener("resize",fitSequenceControls,{passive:true});
  window.addEventListener("orientationchange",()=>{
    setTimeout(fitSequenceControls,80);
    setTimeout(fitSequenceControls,350);
  },{passive:true});

  if(window.visualViewport){
    window.visualViewport.addEventListener(
      "resize",
      fitSequenceControls,
      {passive:true}
    );
    window.visualViewport.addEventListener(
      "scroll",
      fitSequenceControls,
      {passive:true}
    );
  }

  if(window.ResizeObserver){
    const observer=new ResizeObserver(fitSequenceControls);
    observer.observe(controls);
  }

  if(window.MutationObserver && stage){
    const observer=new MutationObserver(fitSequenceControls);
    observer.observe(stage,{
      attributes:true,
      attributeFilter:["style","class"]
    });
  }

  fitSequenceControls();
  setTimeout(fitSequenceControls,120);
  setTimeout(fitSequenceControls,600);
})();
</script>
