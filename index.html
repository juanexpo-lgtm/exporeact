
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPO REACT V4</title>

    <style>
/* =====================================================
   EXPO REACT V4
   Hoja de estilos
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{

    background:white;

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* ---------- PANEL ---------- */

#panel{

    width:500px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 25px rgba(0,0,0,.15);

}

h1{

    text-align:center;

    margin-bottom:-15px;

    font-size:34px;

}

.grupo{

    margin-bottom:25px;

}

label{

    display:block;
    margin:0 auto 12px auto;
    padding:4px 14px;
    width:fit-content;
    background:#444;
    color:white;
    font-weight:normal;
    text-align:center;
    border-radius:5px;

}

/* ---------- CONTROLES ---------- */

.controlNumero{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:2px;

}

.controlNumero button{

    width:42px;

    height:42px;

    font-size:24px;

    cursor:pointer;
    display:block;
    margin:0 auto;

}

.controlNumero span{

    width:80px;

    text-align:center;

    font-size:26px;

}

/* ---------- PALETA ---------- */

#paleta{

    display:flex;

    justify-content:center;
gap:2px;

}

.color{

    width:55px;

    height:55px;

    border-radius:8%;

    border:2px solid transparent;

    cursor:pointer;

    transition:transform .15s ease, box-shadow .15s ease, opacity .2s;

}

.color.activo{

    border-color:black;

    opacity:1;


}

.color:not(.activo){

    opacity:.30;

}

/* ---------- PLAY ---------- */

#play{
    width:80%;
    display:block;
    margin:0 auto;

    height:55px;

    font-size:30px;

    background:#000000;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;


    box-shadow:0 8px 18px rgba(0,0,0,.40);
    transition:transform .18s ease, box-shadow .18s ease;
}

/* ---------- CONTROLES INFERIORES ---------- */

#controles{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
display:none;
gap:12px;
z-index:1000;
}

#controles button{
min-width:85px;
height:38px;
padding:0 14px;
background:rgba(0,0,0,.2);
color:#000;
font-size:28px;
border:none;
border-radius:8px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

#pausa{
transform:none;
}

#stop{
font-size:14px !important;
line-height:1;
}

#pausa .icon-pausa{
display:block;
line-height:1;
position:relative;
top:-3px;
}



#menosIntervalo{margin-right:-4px !important;}
#masIntervalo{margin-left:-4px !important;}

#intervaloInfo{
position:relative;
top:4px;
width:46px;
height:30px;
padding:0 2px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.2);
color:#000;
font-size:14px;
border-radius:6px;
flex:0 0 auto;
overflow:hidden;
}

#cronometro{
position:fixed;top:20px;right:25px;
padding:6px 12px;
background:rgba(0,0,0,.2);
color:#000;
font-size:16px;
font-family: Arial, Helvetica, sans-serif;
border-radius:8px;
display:none;
z-index:2000;
user-select:none;
}

#cronometro .cronotext{
display:inline-block;
position:relative;
top:1px;
}



#play:hover{
    transform:translateY(2px);
    background:#333;
    box-shadow:0 12px 24px rgba(0,0,0,.45);
}

#play:active{
    transform:translateY(3px);
    box-shadow:0 5px 10px rgba(0,0,0,.30);
}



.color:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 4px 10px rgba(0,0,0,.25);
}

#cursorVirtual{
position:fixed;
width:18px;
height:18px;
border:none;
background:rgba(0,0,0,.2);
border-radius:50%;
pointer-events:none;
display:none;
z-index:99999;
transform:translate(-50%,-50%);
}


#cuentaAtras{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:220px;
font-weight:bold;
font-family:Arial,Helvetica,sans-serif;
color:#000;
display:none;
z-index:100000;
user-select:none;
}

</style>
</head>

<body>
<div id="cursorVirtual"></div>
<div id="cuentaAtras"></div>

    <div id="panel">

        <div class="grupo">

            <label>ELIGE NÚMERO DE ESTÍMULOS Y COLORES</label>

            <div id="paleta">

                <button class="color activo"
                        data-color="red"
                        style="background:red">
                </button>

                <button class="color activo"
                        data-color="blue"
                        style="background:blue">
                </button>

                <button class="color activo"
                        data-color="#60F013"
                        style="background:#60F013">
                </button>

                <button class="color activo"
                        data-color="yellow"
                        style="background:#fff52d">
                </button>

            </div>

        </div>

        <div class="grupo">

            <label>INTERVALO ENTRE ESTÍMULOS (segundos)</label>

            <div class="controlNumero">

                <button id="menosIntervalo">−</button>

                <span id="valorIntervalo">1.0</span>

                <button id="masIntervalo">+</button>

            </div>

        </div>

        <button id="play">START</button>

    </div>

    <div id="controles">
        <button id="pausa"><span class="icon-pausa">⏸</span></button>
        <div id="intervaloInfo">1.00 s</div>
        <button id="stop">SALIR</button>
    </div>
<div id="cronometro"><span class="cronotext">00:00</span></div>

    <script>
    /* EXPO REACT V4 - Script compatible con tu index.html y style.css */

    
const cursorVirtual=document.getElementById("cursorVirtual");
document.addEventListener("mousemove",e=>{
  cursorVirtual.style.left=e.clientX+"px";
  cursorVirtual.style.top=e.clientY+"px";
});

const cuentaAtras=document.getElementById("cuentaAtras");

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();

function beep(duracion=0.18,frecuencia=950){
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type="square";
 osc.frequency.value=frecuencia;
 gain.gain.setValueAtTime(0.8,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duracion);
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start();
 osc.stop(audioCtx.currentTime+duracion);
}

function esperar(ms){return new Promise(r=>setTimeout(r,ms));}

async function cuentaRegresiva(){
 cuentaAtras.style.display="block";
 cuentaAtras.textContent="3";
 beep(0.18,950);
 await esperar(1000);
 cuentaAtras.textContent="2";
 beep(0.18,950);
 await esperar(1000);
 cuentaAtras.textContent="1";
 beep(0.55,1200);
 await esperar(1000);
 cuentaAtras.style.display="none";
}

const panel=document.getElementById("panel");
    const play=document.getElementById("play");
    const stop=document.getElementById("stop");
const pausa=document.getElementById("pausa");
const cronometro=document.getElementById("cronometro");
const intervaloInfo=document.getElementById("intervaloInfo");

    const menosIntervalo=document.getElementById("menosIntervalo");
    const masIntervalo=document.getElementById("masIntervalo");

    const valorIntervalo=document.getElementById("valorIntervalo");

    const botones=[...document.querySelectorAll(".color")];

    let intervalo=1.0;
    const blanco=600;
    let ejecutando=false;
    let t1=null,t2=null;
let pausado=false;
let tiempoAcumulado=0;
let inicioCronometro;
let relojCronometro;

    function actualizar(){
      valorIntervalo.textContent=intervalo.toFixed(1);
    }
    actualizar();

    masIntervalo.onclick=()=>{intervalo=+(intervalo+0.1).toFixed(1);actualizar();}
    menosIntervalo.onclick=()=>{intervalo=Math.max(0.1,+(intervalo-0.1).toFixed(1));actualizar();}

    botones.forEach(b=>{
     b.onclick=()=>{
       if(b.classList.contains("activo")){
          if(document.querySelectorAll(".color.activo").length>2){
             b.classList.remove("activo");
          }
       }else{
          b.classList.add("activo");
       }
     };
    });

    function activos(){
     return [...document.querySelectorAll(".color.activo")].map(b=>b.dataset.color);
    }

    function azar(){
     const c=activos();
     return c[Math.floor(Math.random()*c.length)];
    }

    function ciclo(){
     if(!ejecutando) return;
     document.body.style.background="white";
     t1=setTimeout(()=>{
       if(!ejecutando) return;
       document.body.style.background=azar();
       t2=setTimeout(ciclo,intervalo*1000);
     },blanco);
    }

    
function iniciarCronometro(){
 inicioCronometro=Date.now()-tiempoAcumulado;
 cronometro.style.display="block";
 relojCronometro=setInterval(()=>{
  const s=Math.floor((Date.now()-inicioCronometro)/1000);
  const m=Math.floor(s/60);
  const ss=s%60;
  cronometro.querySelector(".cronotext").textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
 },1000);
}
function pausarCronometro(){clearInterval(relojCronometro);tiempoAcumulado=Date.now()-inicioCronometro;}
function reanudarCronometro(){inicioCronometro=Date.now()-tiempoAcumulado;relojCronometro=setInterval(()=>{const s=Math.floor((Date.now()-inicioCronometro)/1000);const m=Math.floor(s/60);const ss=s%60;cronometro.querySelector(".cronotext").textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");},1000);}
function detenerCronometro(){
 clearInterval(relojCronometro);
 cronometro.style.display="none";
 cronometro.querySelector(".cronotext").textContent="00:00";
}

async function iniciar(){
     if(ejecutando) return;
     ejecutando=true;
     panel.style.display="none";
     document.getElementById("controles").style.display="flex";
     document.body.style.cursor="none";
     cursorVirtual.style.display="block";
     try{
       if(!document.fullscreenElement){
          await document.documentElement.requestFullscreen();
       }
     }catch(e){}
     intervaloInfo.textContent=intervalo.toFixed(2)+" s";
     await cuentaRegresiva();
     iniciarCronometro();
     ciclo();
    }

    async function detener(){
     ejecutando=false;
     clearTimeout(t1);
     clearTimeout(t2);
     detenerCronometro();
     document.body.style.background="white";
     panel.style.display="block";
     document.getElementById("controles").style.display="none";
     document.body.style.cursor="default";
     cursorVirtual.style.display="none";
     try{
       if(document.fullscreenElement){
          await document.exitFullscreen();
       }
     }catch(e){}
    }

    
    pausa.onclick=()=>{
      if(!ejecutando) return;
      if(!pausado){
        pausado=true;
        clearTimeout(t1);clearTimeout(t2);
        pausarCronometro();
        document.body.style.background="white";
        pausa.textContent="▶";
      }else{
        pausado=false;
        reanudarCronometro();
        pausa.textContent="⏸";
        ciclo();
      }
    };


document.addEventListener("keydown",(e)=>{
  if(e.code==="Space"){
    e.preventDefault();
    if(ejecutando){
      pausa.click();
    }
  }
});

play.onclick=iniciar;
    stop.onclick=detener;

    document.addEventListener("fullscreenchange",()=>{
     if(!document.fullscreenElement && ejecutando){
        detener();
     }
    });

</script>

</body>

</html>
